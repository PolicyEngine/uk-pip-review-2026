name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Analysis tests (pytest, ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
      - name: Public data guard
        run: uv run python scripts/check_public_data.py
      - name: Placeholder results regenerate byte for byte
        run: |
          status=$(python3 -c 'import json; print(json.load(open("data/results.json"))["status"])')
          if [ "$status" = "placeholder" ]; then
            uv run pip-review generate --out /tmp/results.json --dashboard-copy /tmp/copy.json
            cmp /tmp/results.json data/results.json
          else
            echo "Model results: provenance is checked against uv.lock by the guard"
          fi

  dashboard:
    name: Dashboard (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Results file in sync with the analysis output
        run: cmp ../data/results.json public/data/results.json
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Built page is noindex and carries the status banner
        run: |
          grep -q 'name="robots" content="noindex' .next/server/app/index.html
          grep -q 'data-testid="status-banner"' .next/server/app/index.html
      - name: Serve the build and check it
        run: bash scripts/smoke-built-site.sh
