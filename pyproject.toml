[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uk-pip-review-2026"
version = "0.1.0"
description = "PolicyEngine UK costing and distributional analysis for the independent review of Personal Independence Payment"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.7",
  "numpy>=1.26",
]

[project.optional-dependencies]
# The engine for real runs: the policyengine-uk and policyengine-core
# versions Microcosm build uk-frs-calibration-attempt-20261112T133744Z-6f918b81
# was built and certified on (src/pip_review/data_build.py). No
# policyengine.py release pins this pair, so simulations load policyengine_uk
# directly. Installed for real runs only; the template's tests run without it
# (no data, no simulation).
model = ["policyengine-uk==2.177.7", "policyengine-core==3.34.10", "huggingface-hub>=0.25"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
pip-review = "pip_review.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pip_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
